<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Script Scheduler (Frontend‑Only)</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <header>
    <h1>Script Scheduler 🕒</h1>
    <nav>
      <button id="tab-upload" class="active">Upload &amp; Schedule</button>
      <button id="tab-jobs">My Jobs</button>
    </nav>
  </header>

  <main>
    <!-- UPLOAD & SCHEDULE -->
    <section id="section-upload">
      <form id="upload-form">
        <h2>1. Upload Script</h2>
        <label>
          Script file (.sh, .bat, ≤1 MB):
          <input type="file" id="file-input" accept=".sh,.bat" required />
        </label>
        <label>
          Script Name:
          <input type="text" id="script-name" required />
        </label>
        <label>
          Platform:
          <select id="platform">
            <option value="sh">Linux/macOS (.sh)</option>
            <option value="bat">Windows (.bat)</option>
          </select>
        </label>
        <button type="submit">Upload</button>
        <p class="error" id="upload-error"></p>
      </form>

      <form id="schedule-form" class="hidden">
        <h2>2. Schedule It</h2>
        <label>
          Frequency:
          <input type="number" id="freq-num" min="1" value="5" required />
          <select id="freq-unit">
            <option value="minutes">minutes</option>
            <option value="hours">hours</option>
            <option value="days">days</option>
          </select>
        </label>
        <label>
          Start at:
          <input type="datetime-local" id="start-time"/>
        </label>
        <label>
          End at (optional):
          <input type="datetime-local" id="end-time"/>
        </label>
        <label class="checkbox">
          <input type="checkbox" id="run-now" /> Run immediately
        </label>
        <button type="submit">Schedule</button>
        <p class="error" id="schedule-error"></p>
      </form>
    </section>

    <!-- JOBS LIST -->
    <section id="section-jobs" class="hidden">
      <h2>My Scheduled Jobs</h2>
      <div id="jobs-container"></div>
    </section>
  </main>

  <!-- Logs Modal -->
  <div id="modal" class="hidden">
    <div class="modal-content">
      <h3>Run Logs</h3>
      <pre id="log-output"></pre>
      <button id="close-modal">Close</button>
    </div>
  </div>

  <div id="toast" class="hidden"></div>
  <script src="script.js"></script>
</body>
</html>
